<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradien Tetesan Kuning (Luar) -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="60%" stop-color="#FFD100" />
      <stop offset="100%" stop-color="#FFAC00" />
    </linearGradient>

    <!-- Gradien Daun Hijau (Kanan) -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E8238" />
      <stop offset="50%" stop-color="#22983B" />
      <stop offset="100%" stop-color="#41B649" />
    </linearGradient>

    <!-- Gradien Tetesan Biru (Tengah) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F57A4" />
      <stop offset="100%" stop-color="#2B72BA" />
    </linearGradient>
  </defs>

  <!-- Background Transparan -->
  <rect width="100%" height="100%" fill="none" />

  <!-- 1. Tetan Kuning Utama (Bentuk Dasar Minyak/Air) -->
  <path d="M 200 65 
           C 200 65, 310 160, 310 260 
           A 110 110 0 0 1 90 260 
           C 90 160, 200 65, 200 65 Z" 
        fill="url(#yellowGrad)" />

  <!-- 2. Daun Hijau (Sisi Kanan dengan Puncak Melengkung) -->
  <path d="M 233 12 
           C 220 30, 195 55, 195 90 
           C 195 140, 260 170, 290 280 
           C 300 240, 300 200, 285 160 
           C 265 110, 240 60, 233 12 Z" 
        fill="url(#greenGrad)" />

  <!-- Corak / Tulang Daun V Putih -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 215 55 L 233 70 L 250 82" />
    <path d="M 210 80 L 235 98 L 258 112" />
    <path d="M 208 108 L 238 128 L 265 145" />
    <path d="M 212 138 L 243 158 L 270 176" />
    <path d="M 220 168 L 248 188 L 273 205" />
    <path d="M 230 198 L 252 216 L 270 230" />
  </g>

  <!-- 3. Frame Pemisah Putih (Garis Pinggir Tetesan Biru) -->
  <path d="M 200 130 
           C 200 130, 262 195, 262 250 
           A 62 62 0 0 1 138 250 
           C 138 195, 200 130, 200 130 Z" 
        fill="#FFFFFF" />

  <!-- 4. Tetesan Biru Utama di Tengah -->
  <path d="M 200 138 
           C 200 138, 255 198, 255 248 
           A 55 55 0 0 1 145 248 
           C 145 198, 200 138, 200 138 Z" 
        fill="url(#blueGrad)" />

  <!-- 5. Teks APN -->
  <text x="200" y="260" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="bold" 
        font-size="34" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="2">APN</text>
</svg>
